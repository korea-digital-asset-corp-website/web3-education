[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

# 테스트 설정
fuzz = { runs = 256 }
invariant = { runs = 256 }

# 포맷팅
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# RPC 설정
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://localhost:8545"
